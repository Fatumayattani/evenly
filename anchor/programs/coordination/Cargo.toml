[package]
name = "coordination"
version = "0.1.0"
description = "Solana program for group treasuries, contributions, and approval-controlled payouts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "coordination"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
